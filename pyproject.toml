requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flextool"
version = "4.3.0"
description = "IRENA FlexTool is an energy and power systems model for understanding the role of variable power generation in future energy systems."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [
    { name = "IRENA FlexTool contributors" },
]
keywords = [
    "energy-systems",
    "optimization",
    "linear-programming",
    "mixed-integer-programming",
    "power-systems",
    "investment-planning",
    "highs",
    "spine",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Solver backend — pure-Python; replaces the retired glpsol pipeline.
    # 2.5.0 routes the HiGHS solver log through Python's sys.stdout so it is
    # visible under the Spine-Toolbox Basic Console on Windows (the b6 Toolbox
    # track relies on this); older releases lose the log there. 2.5.1 gates
    # that routing on the sink: it only suppresses HiGHS' native log when
    # sys.stdout isn't fd 1, so machines whose highspy callback is silent
    # (some Linux builds) keep the native log instead of losing it entirely.
    # 2.6.0 adds Problem.coef_zero_threshold, which the v59 model-wide
    # small-number coefficient cutoff sets.  3.0.0 ships the Benders building
    # blocks the regional decomposition uses (WarmProblem.add_cut_row /
    # solve(retry_on_unknown=) and the polar_high.parallel helpers).  3.1.0
    # adds Solution.max_primal_infeasibility, which the Benders master coupling
    # self-check reads to size its tolerance.  3.2.0 makes autoscale Layer 3
    # centre the objective over HiGHS' cost comfort zone (clearing the
    # "excessively small costs" warning that the legacy 1e-6 scale_the_objective
    # provokes).  3.3.0 adds polar_high.decomposition.StallMonitor (the Benders
    # stall guard).  3.4.0 adds decomposition.InOutStabilizer, the generic in-out
    # separation picker the Benders in-out stabilization drives.  3.5.0 adds
    # polar_high.benders (the generic multicut Benders coordinator the FlexTool
    # driver now runs on), WarmProblem.compact_cuts + fix_col_ids/bounds
    # accessors, and solve_with_fallback.  3.6.0 adds TrustRegionStabilizer /
    # native_cost_at (the Benders trust-region wiring) and the name-keyed
    # warm-start basis primitives (get/set_named_basis, basis_name_fingerprint,
    # seed_primal, write_mps fingerprint) that the b24 basis cache injects
    # through.  3.6.1 makes the coefficient floor scale-invariant (user-space)
    # — required: the regenerated goldens for the battery/DR scenarios and the
    # commodity-ladder trade model encode the corrected `full`-autoscale
    # solutions, which the pre-3.6.1 (buggy) floor mis-computes — the hard floor.
    # 3.7.0 adds Solution.solve_diagnostics(), which the cascade solve-acceptance
    # path (engine/solve/_acceptance.py) calls to decide whether a
    # HiGHS-uncertified solve is usable — required, or that call AttributeErrors.
    # 3.8.0 adds per-element variable bounds (Param-valued ``upper``), which
    # the indirect-unit input-arc limit (input_share_max) uses on
    # constant-capacity units.  3.12.0 adds the Layer-2 ArrayClassifier
    # (column tables as numpy arrays) and highs_names="auto" (LP names stay
    # out of HiGHS unless a HiGHS option writes a file with them), both used
    # by the in-process solve; 3.9-3.11 were never tagged.  3.12.1 sums the
    # shared-column terms of a Var (the one flow column of a coarse process,
    # read at every fine step) in a fixed order and keeps their column ids —
    # required: without it a coarse LP is not byte-deterministic across runs.
    # 3.12.2 leaves POLARS_MAX_THREADS alone once polars is imported — required:
    # an older one sets it to 1 at import, and child processes inherit that value.
    # 3.12.3 runs its join chains in written order on polars 2.x — required with
    # polars 2: an older one lets polars reorder them, about 3x the peak RAM.
    # 3.12.4 writes every column into the MPS file and gives the basis-cache key
    # with generic names — required: on the MPS solve path an older one shifts
    # the solution values after a variable used nowhere.
    # 3.13.0 adds SolveDiagnostics.mip_gap (an in-process HiGHS MIP stopped
    # at a limit names its gap) and gives the same coefficient bits in every
    # run, whatever the thread count or polars engine.
    "polar-high>=3.13.0",
    # Autoscale Layer 3 drives HiGHS' power-of-two objective conditioning
    # through the ``user_objective_scale`` option.  HiGHS renamed the older
    # ``user_cost_scale`` to ``user_objective_scale`` after 1.10.0, so older
    # 1.x wheels reject it ("getOptionIndex: Option "user_objective_scale"
    # is unknown") and the Layer-3 objective centering silently degrades to
    # an un-conditioned solve.  The lower bound keeps a fresh install from
    # resolving to an older wheel; patch releases are allowed, the next minor
    # is capped until it has been tested (the weekly canary workflow,
    # .github/workflows/canary.yml, flags a new minor).  1.15.1 is the floor:
    # from 1.15 the Windows wheel ships its own msvcp140.dll, while 1.14.0
    # (system msvcp140) import-crashes on Windows 10 1809 / Server 2019
    # (HiGHS#2964); flextool.env_check offers this requirement when an older
    # highspy crashes.
    "highspy>=1.15.1,<1.16",
    # polars 1.40 introduced `pl.struct(...).is_sorted()` (and polar_high's
    # `_verify_dense_sorted` relies on the same call); older versions raise
    # "could not apply comparison on series of dtype 'binary[offset]'" and
    # silently bypass autoscale Layer 2/3.  Capped below the next major
    # (polars majors change row-order and API guarantees — 2.0 broke the
    # rolling warm-start, fixed in 4.0.5); the weekly canary tests the newest.
    "polars>=1.40,<3",
    # Core data + I/O.  pandas: the floor is spinedb-api's own requirement
    # (>=2.2.3); 3.0.x is what fresh installs get and what CI tests; the next
    # major is capped.
    "pandas>=2.2.3,<4",
    # spinedb-api is 0.x and its minor releases break the API (0.33 SQLAlchemy
    # 1.4 + mandatory ``with`` sessions, 0.34 new item API, 0.36 SQLAlchemy 2),
    # so it is capped to the tested minor series.  0.36.5 added the
    # parameter_group table that FlexTool's databases and Excel export use.
    "spinedb-api>=0.36.5,<0.37",
    "openpyxl",
    "odfpy",
    "python-calamine",
    "xlsxwriter",
    "pyyaml",
    "matplotlib",
    "psutil",
    # GUI runtime — sv-ttk pulls tkinter theming.  Headless installs that
    # never import flextool.gui won't actually load this, but it's
    # listed as core to keep the existing CLI ↔ GUI installs symmetric.
    # Move to an optional [gui] extra in a future release if headless
    # users complain about the install size.
    "sv-ttk",
    # Per-monitor geometry so GUI windows open on the main window's
    # monitor instead of stretching across the whole virtual desktop.
    # Tk has no portable multi-monitor API; flextool.gui.ui_metrics falls
    # back to a maximise-probe if this is unavailable.
    "screeninfo",
    "pywin32; sys_platform == 'win32'",
    # The per-user cache folder of the assistant's documentation index (built on
    # first use, flextool.assistant.docs_store) on every platform, instead of
    # reading LOCALAPPDATA / XDG_* by hand; later also the user config folder.
    "platformdirs>=4",
    # The assistant tools validate each call's arguments against the tool's JSON schema
    # (flextool.assistant.registry); the connection server for AI agents does not.
    "jsonschema>=4.18",
    # The connection server for AI agents (``flextool-assistant --mcp``) speaks the Model
    # Context Protocol over stdin/stdout.  2.x: the low-level server takes its handlers in
    # the constructor (flextool.assistant.mcp_server); the next major is capped.  Loaded
    # only by ``--mcp`` and ``--call``.
    "mcp>=2.3,<3",
    # The assistant's chat talks to AI services through their own libraries, imported only
    # when a chat backend is built (flextool.assistant.llm_adapter.make_backend), never by
    # ``--mcp`` / ``--call``.  FlexTool passes its own HTTP client (header allow-list, proxy
    # decision, no redirects) and does its own retries.  anthropic 2.6: the httpx2 line and
    # the ``open_telemetry`` switch; the next major is capped.
    "anthropic>=2.6,<3",
    # Every OpenAI-compatible service (OpenAI, Mistral, OpenRouter, Gemini, Ollama, LM Studio,
    # any other base URL).  3.46: chunks keep unknown fields in ``model_extra`` and
    # ``extra_body`` reaches the request body; the next major is capped.
    "openai>=3.46,<4",
    # The assistant chat keeps the AI services' keys in the system keyring (Windows Credential
    # Manager, macOS Keychain, Secret Service on Linux; flextool.assistant.keys).  Never
    # keyrings.alt: FlexTool refuses backends that store keys unencrypted.
    "keyring>=25",
]

[project.urls]
Documentation = "https://irena-flextool.github.io/flextool/"
Repository = "https://github.com/irena-flextool/flextool"
Issues = "https://github.com/irena-flextool/flextool/issues"

[project.optional-dependencies]
toolbox = ["spinetoolbox"]
viewer = ["tsdownsample>=0.1.3", "networkx>=3.0"]
# Processors without AVX2/FMA/BMI2/MOVBE (x86-64-v3): polars' default native
# runtime crashes there.  polars-runtime-compat (x86-64-v2) is installed next
# to it and polars loads it in preference; it is about 10-30% slower and
# safe on any x86-64-v2 CPU.  flextool.env_check installs the same build
# when it detects such a CPU.
compat = ["polars[rtcompat]>=1.40,<3"]
# Backward-compat alias — engine-polars is now the only engine and its
# dependencies are part of the core install.  Empty list kept so any
# automation pinned to ``pip install flextool[engine-polars]`` keeps
# working.
engine-polars = []
# Dev tooling for running the test suite locally and in CI.  ``pytest``
# itself is included for completeness even though it's transitively
# pulled in by ``spinetoolbox``.  ``pytest-timeout`` enforces a hard
# per-test wallclock cap so a HiGHS solve that wedges in a C extension
# doesn't stall the full sweep (see ``[tool.pytest.ini_options]``
# below for the default).
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    # Parallel test execution.  The default ``addopts`` runs the suite with
    # ``-n 8`` (see ``[tool.pytest.ini_options]`` below), so xdist is a hard
    # dev/CI requirement, not optional.
    "pytest-xdist>=3.0",
    "ruff>=0.5",
]

[project.gui-scripts]
# Windowed launchers — on Windows these use pythonw.exe (no stray console
# window behind the GUI); identical to [project.scripts] on Linux/macOS. Bare
# `flextool` is equivalent to `python -m flextool.gui`.
flextool = "flextool.gui.__main__:main"
flextool-gui = "flextool.gui.__main__:main"

[project.scripts]
# Primary entry points — kept hyphen-cased for `flextool-*` CLI uniformity.
# ``flextool-run`` is the stdlib-only supervisor that runs the engine
# (``flextool.cli.cmd_run_flextool``) as its child and writes the run's
# ``_run.log``; it never imports ``flextool`` (see ``[tool.setuptools]``).
flextool-run = "flextool_run_supervisor:main"
flextool-update = "flextool.cli.cmd_update_flextool:main"
flextool-trust-workspace = "flextool.cli.cmd_trust_workspace:main"
flextool-write-outputs = "flextool.cli.cmd_write_outputs:cli"
flextool-migrate-database = "flextool.cli.cmd_migrate_database:main"
flextool-freeze = "flextool.cli.cmd_freeze_database:main"
flextool-project = "flextool.cli.cmd_project_package:main"
flextool-time-runs = "flextool.cli.cmd_time_runs:main"
flextool-scenario-results = "flextool.cli.cmd_scenario_results:cli"
flextool-execute-workflow = "flextool.cli.cmd_execute_flextool_workflow:cli"
flextool-export-to-tabular = "flextool.cli.cmd_export_to_tabular:main"
flextool-read-tabular-input = "flextool.cli.cmd_read_tabular_input:main"
flextool-read-self-describing-tabular-input = "flextool.cli.cmd_read_self_describing_tabular_input:main"
# Existing entry points retained.
flextool-read-old = "flextool.cli.cmd_read_old_flextool:cli"
flextool-import-sensitivities = "flextool.cli.cmd_import_sensitivities:cli"
flextool-read-matpower = "flextool.cli.cmd_read_matpower:main"
# The read-only tools for AI assistants: ``--mcp`` serves them to an AI agent over
# stdin/stdout, ``--call`` runs one.  A top-level stdlib module, so it can keep the
# protocol's stdout clean before ``import flextool`` (never a gui-script: it needs stdio).
flextool-assistant = "flextool_assistant_entry:main"

[tool.pytest.ini_options]
pythonpath = ["."]
# ``-n 8`` runs the suite across 8 worker processes by default (pytest-xdist,
# a [dev] dependency).  Each worker is a separate process, so the per-test
# global-state resets stay isolated.  Pass ``-n 0`` to disable parallelism for
# interactive debugging (``-s`` / ``--pdb`` need a single process).
# ``-n auto`` matches worker count to the host's CPUs so we don't oversubscribe
# on low-core CI runners (``-n 8`` on a 4-core runner ran heavy solver tests ~2x
# slower and tripped the per-test timeout). ``--dist loadfile`` keeps every test
# in a file on ONE worker, so an expensive module-scoped fixture (e.g. the
# energy-margin double-cascade, ~400s) is built once instead of being rebuilt on
# each worker that happens to receive one of the module's tests.
# ``-m "not csv_reload"`` deselects the opt-in CSV reload contract tests
# (``tests/csv_reload/``; run them with ``pytest -m csv_reload tests/csv_reload/``).
# A command-line ``-m`` replaces this one, so ``tests/csv_reload/conftest.py``
# also skips them unless the ``-m`` expression names ``csv_reload``.
# ``not axis_enums`` likewise deselects the opt-in axis-Enum mode LP parity run
# (``tests/engine/axis_enums/``; ``pytest -m axis_enums tests/engine/axis_enums -n 8``),
# skipped by ``tests/engine/axis_enums/conftest.py`` unless ``-m`` names ``axis_enums``.
# ``not commercial_shim`` deselects the opt-in commercial-solver shim checks (``tests/engine/commercial_shim/``;
# ``pytest -m commercial_shim tests/engine/commercial_shim -n 0``; they need the solvers' Python packages).
addopts = "--import-mode=importlib -n auto --dist loadfile -m 'not csv_reload and not axis_enums and not commercial_shim'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nightly_heavy: the heaviest tests (~1 h of CI worker time); the PR Tests workflow deselects them and its nightly job runs them. Local runs include them",
    "solver: marks tests that invoke a real solver (5-60s each); deselect with '-m \"not solver\"'",
    "smoke: fast Layer-1 scenarios for the per-commit gate",
    "gui: opens a real interactive Tk window; opt-in via --run-gui (deselected by default)",
    "csv_reload: CSV reload contract tests in tests/csv_reload/; opt-in via -m csv_reload (deselected by default)",
    "axis_enums: axis-Enum mode LP parity run (tests/engine/axis_enums/); opt-in via -m axis_enums",
    "commercial_shim: item 230 against the commercial solvers' Python packages through CLI shims (tests/engine/commercial_shim/); opt-in via -m commercial_shim",
]
testpaths = ["tests"]
# Hard per-test wallclock cap.  Used by ``pytest-timeout`` (installed
# via ``pip install -e .[dev]``).  The default applies to every test
# unless overridden with ``@pytest.mark.timeout(N)`` or the CLI
# ``--timeout=N``.  The heaviest legitimate fixtures (energy-margin
# double-cascade) run ~400 s serially, so 900 s leaves headroom on slower CI
# hardware while still cutting off HiGHS runs that wedge in a C extension and
# ignore SIGTERM.
# ``thread`` mode runs the test in a thread and dumps a traceback
# on timeout — works for tests stuck inside C extensions where the
# default ``signal`` mode can't fire from a non-main thread.
timeout = 900
timeout_method = "thread"

[tool.setuptools]
# Top-level modules outside the ``flextool`` package.  ``flextool_run_supervisor``
# must load without ``import flextool`` (which imports polars), and
# ``flextool_assistant_entry`` redirects stdout before it imports it; an editable
# install learns a new top-level name only when it is reinstalled.
py-modules = ["flextool_run_supervisor", "flextool_assistant_entry"]

[tool.setuptools.cmdclass]
# Copies the curated documentation Markdown (flextool/docs_build/scope.py) into
# flextool/assistant/_docs/md/ of the build; build-time only, so the module
# reaches the sdist through MANIFEST.in, not py-modules.
build_py = "_flextool_build.BuildPy"

[tool.setuptools.packages.find]
# Auto-discover all flextool subpackages.  Excludes test/scratch dirs.
where = ["."]
include = ["flextool*"]
exclude = ["flextool*.__pycache__"]

[tool.setuptools.package-data]
# Static data files bundled with the wheel and accessed at runtime via
# ``flextool._resources.package_data_path``:
#   * schemas/*.json                    — schema templates (spinedb_schema.json, axis
#                                         contract, output/comparison-settings seeds)
#   * schemas/*.md                      — schema docs (AXIS_CONTRACT.md)
#   * schemas/*.yaml                    — YAML configs (default plots/colors)
#   * schemas/canonical_databases/*.json — canonical example/template DB sources
#   * schemas/pre_v26/*.json            — pre-v26 migration-step template snapshots
#   * solver_config/*.opt.template      — solver options templates (HiGHS + the
#                                         commercial solvers; seeded into
#                                         solver_config/<solver>.opt on first run)
#   * engine/solve/solver_catalogue/*.json — every parameter of each solver and what the
#                                         input database may do with it (item 240 B1;
#                                         written by tools/solver_catalogue.py)
#   * export_to_tabular/*.yaml          — export settings (sheet config etc.)
#   * process_inputs/*.json             — old-Excel/CSV import spec
#                                         (import_old_excel_input.json), loaded by
#                                         the flextool-read-tabular-input CLI.
#   * assistant/_docs/md/**.md          — the curated documentation, copied in by
#                                         the build step (_flextool_build.py) and
#                                         indexed by the assistant on first use;
#                                         not in the source tree (.gitignore).
#
# NOTE (intentionally NOT shipped): schemas/canonical_databases/_recipes.yaml is
# a *maintainer/build-only* recipe consumed solely by
# flextool.update_flextool.generate_canonical, which is source-checkout-only
# (it reads tests/fixtures/*.json and imports tests.db_utils — neither of which
# is in a wheel) and fails loudly if run from an installed package.  Shipping it
# would add an inert file with no runtime reachability, so the
# canonical_databases glob deliberately stays *.json.
flextool = [
    "schemas/*.json",
    "schemas/*.md",
    "schemas/*.yaml",
    "schemas/canonical_databases/*.json",
    "schemas/pre_v26/*.json",
    "solver_config/*.opt.template",
    "engine/solve/solver_catalogue/*.json",
    "export_to_tabular/*.yaml",
    "process_inputs/*.json",
    "assistant/_docs/md/*.md",
    "assistant/_docs/md/dev/*.md",
    "assistant/_docs/md/solvers/*.md",
    "assistant/_docs/md/reference/*.md",
    "assistant/_docs/md/how_to/*.md",
]
