name: Tests
on:
  push:
    # `main` is the default branch; `master` kept transitionally (see ci.yml).
    branches: [main, master]
    # Docs-only changes don't affect tests — skip the heavy cross-platform
    # matrix. ci.yml's required Smoke check has NO paths filter, so it still
    # runs and gates PRs (path-ignoring a required check would block it).
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md']
  schedule:
    # 02:00 UTC nightly: only the `nightly-heavy` job runs on this trigger.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  template-check:
    name: Verify master template is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e .

      - name: Verify master template matches migrations
        run: python -m flextool.update_flextool.sync_master_json_template --verify

      - name: Verify tests/fixtures/*.json are at current schema
        run: python -m flextool.update_flextool.test_fixtures verify

      - name: Verify canonical_databases match generated output
        run: python -m flextool.update_flextool.generate_canonical --verify

      - name: Verify canonical_databases match current schema
        run: python -m flextool.update_flextool.canonical_databases verify

  test:
    # Full suite minus the `nightly_heavy` tests, on 4 OS/Python cells (Linux
    # 3.13 + 3.14, Windows 3.14, macOS 3.14; 3.11 / 3.12 run in
    # tests-old-python.yml), each cell split into 4 module-atomic, time-balanced
    # shards (`--shard K/N`, tests/_ci_shard.py; weights in
    # tests/ci_durations.json). One xdist worker per LOGICAL core (`-n logical`):
    # the public runners have 4 vCPUs = 2 SMT cores on Linux / Windows (16 GB)
    # and 3 cores on macOS-15 arm64 (7 GB), and the addopts `-n auto` counts
    # physical cores only (2 workers). 4 shards x 4 cells = 16 jobs stay within
    # the free plan's 20 concurrent jobs and 5 concurrent macOS jobs (5 shards
    # would queue); predicted Linux shard ~27 min. `peak_mem.py` prints the
    # runner's cores and the run's peak memory. Genuinely platform-specific
    # tests are skipped in place (POSIX-only path/shebang forms, Windows file
    # locks), and the one non-unique-optimum scenario (network_all_tech) is
    # skipped pending reformulation (see its skip_reason in
    # tests/scenarios.yaml). No `-x`: a failing shard still reports every
    # failure and full timings. Not run on the nightly schedule.
    if: github.event_name != 'schedule'
    name: test (${{ matrix.cell.os }}, ${{ matrix.cell.python }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        cell:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-15, python: "3.14"}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.cell.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.cell.python }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib setuptools

      - name: Set glpsol executable permission
        if: runner.os != 'Windows'
        run: |
          if [ -f bin/glpsol ]; then chmod +x bin/glpsol; fi
          if [ -f bin/glpsol_macos15_arm64 ]; then chmod +x bin/glpsol_macos15_arm64; fi

      - name: Run tests
        env:
          # Fail loudly on autoscale-registry gaps instead of silently
          # degrading to an un-scaled LP. The full suite is verified
          # gap-free (see docs/dev/architecture.md "Numerical scaling →
          # Layer 2").
          FLEXTOOL_AUTOSCALE_STRICT: "1"
        # A command-line -m replaces the addopts one, so repeat its opt-outs;
        # the command-line -n overrides the addopts `-n auto`.
        run: >-
          python .github/scripts/peak_mem.py
          pytest tests/ -v --tb=short -n logical --shard ${{ matrix.shard }}/4
          -m "not csv_reload and not axis_enums and not nightly_heavy"

  nightly-heavy:
    # The `nightly_heavy` tests (~1 h of worker time: rolling twin-LP builds,
    # nested-cascade determinism, calibration loop, energy-margin adder
    # cascades, ...) that the PR `test` job deselects. A fast representative of
    # each area stays in the PR run. Linux only: Linux is the authoritative
    # platform (Windows / macOS are non-blocking).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: nightly-heavy (ubuntu-latest, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib setuptools

      - name: Set glpsol executable permission
        run: |
          if [ -f bin/glpsol ]; then chmod +x bin/glpsol; fi

      - name: Run nightly-heavy tests
        env:
          FLEXTOOL_AUTOSCALE_STRICT: "1"
        run: >-
          python .github/scripts/peak_mem.py
          pytest tests/ -v --tb=short -n logical
          -m "nightly_heavy and not csv_reload and not axis_enums"
