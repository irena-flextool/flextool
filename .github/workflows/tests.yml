name: Tests
on:
  push:
    # `main` is the default branch; `master` kept transitionally (see ci.yml).
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  template-check:
    name: Verify master template is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Verify master template matches migrations
        run: python -m flextool.update_flextool.sync_master_json_template --verify

      - name: Verify tests/fixtures/*.json are at current schema
        run: python -m flextool.update_flextool.test_fixtures verify

      - name: Verify canonical_databases match generated output
        run: python -m flextool.update_flextool.generate_canonical --verify

      - name: Verify canonical_databases match current schema
        run: python -m flextool.update_flextool.canonical_databases verify

  test:
    # Linux and Windows are blocking. macOS is non-blocking (experimental): the
    # golden solver tests are not bit-portable there — an LP with multiple optima
    # (e.g. demand-response shift) lets HiGHS pick a different, equally-optimal
    # vertex than the Linux-generated golden, so a handful of scenario CSVs
    # differ by valid alternative solutions rather than a real regression.
    # Reconciling that (per-platform goldens or tolerance policy) is a separate,
    # deliberate decision; until then macOS runs and reports but doesn't block.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: macos-15
            python: "3.12"
            experimental: true
          - os: macos-15
            python: "3.13"
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib

      - name: Set glpsol executable permission
        if: runner.os != 'Windows'
        run: |
          if [ -f bin/glpsol ]; then chmod +x bin/glpsol; fi
          if [ -f bin/glpsol_macos15_arm64 ]; then chmod +x bin/glpsol_macos15_arm64; fi

      - name: Run tests
        env:
          # Fail loudly on autoscale-registry gaps instead of silently
          # degrading to an un-scaled LP. The full suite is verified
          # gap-free (see docs/dev/architecture.md "Numerical scaling →
          # Layer 2").
          FLEXTOOL_AUTOSCALE_STRICT: "1"
        run: pytest tests/ -v --tb=short -x
