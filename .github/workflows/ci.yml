name: CI

# CI gate:
#   smoke  — every push and pull_request; <1 min, blocks merge
#   docs-check — every push and pull_request: tests/docs and a mkdocs build with the generated pages
#   gui-tests — every push and pull_request: the Tk tests of tests/gui under xvfb with a window manager
#   slow   — nightly only; xlsx workflow + other slow integration tests
# The whole suite runs sharded in the Tests workflow (tests.yml) and its heaviest
# modules in that workflow's nightly-heavy job.
#
# All jobs use the in-repo HiGHS / glpsol binaries under bin/ (no external
# secrets). The `chmod +x` step makes them executable after checkout.

on:
  push:
    # `main` is the default branch. `master` is retained transitionally so CI
    # keeps firing on the deprecated branch until it is fully retired; drop it
    # once the default-branch switch has settled.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 03:00 UTC nightly
    - cron: "0 3 * * *"
  workflow_dispatch:

# The tests and every FlexTool run they start are single-threaded (polars and HiGHS): the xdist
# workers already use every vCPU, so more threads per worker only oversubscribe the runner.
env:
  FLEXTOOL_THREADS: "1"
  POLARS_MAX_THREADS: "1"

jobs:
  smoke:
    name: Smoke (per-commit gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib

      - name: Set solver binary permissions
        run: |
          if [ -f bin/highs ]; then chmod +x bin/highs; fi

      - name: Run smoke gate
        # Just the smoke-marked fast Layer-1 scenarios — the genuine per-commit
        # gate. The whole suite runs sharded in the Tests workflow (it ran ~the
        # whole suite here and blew the 1-min cap).
        run: pytest -m smoke -v --tb=short

  docs-check:
    name: Docs check (generated pages + mkdocs build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        # As the smoke job, plus the MkDocs toolchain of docs.yml.
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions

      - name: Header grammar, generated pages and output metadata
        run: pytest tests/docs -n 0 -v --tb=short

      - name: Build the web docs
        # The hook (tools/mkdocs_hooks.py) generates the formulation page and the results catalogue.
        run: mkdocs build

  gui-tests:
    # The Tk tests (the modules in tests/conftest.py _GUI_DISPLAY_MODULES and
    # those marked 'gui', e.g. tests/gui/assistant) need a display: xvfb, with
    # openbox as the window manager so that mapping, focus, grabs and the work
    # area (_NET_WORKAREA) behave as on a desktop.  --gui-only leaves the
    # Tk-free tests/gui modules to the sharded Tests workflow.  A required
    # check, so it lives here without a path filter (a Markdown-only PR still
    # gets it).  Serial (-n 0): the tests move the keyboard focus, which is
    # one per display.  Windows / macOS Tk stay manual.
    name: GUI tests (Linux, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the display and the window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib

      - name: Run the Tk tests
        run: >-
          xvfb-run -a sh -c 'openbox & sleep 1;
          python -m pytest tests/gui --run-gui --gui-only -v --tb=short -n 0 --timeout 300'

  slow:
    name: Slow (nightly only)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib

      - name: Set solver binary permissions
        run: |
          if [ -f bin/highs ]; then chmod +x bin/highs; fi

      - name: Run slow tests
        run: pytest tests/ -v --tb=short -n logical -m slow

  enum-mode:
    name: Axis-Enum mode LP parity (nightly, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Axis-Enum mode (FLEXTOOL_AXIS_ENUMS=1) is experimental and off in
    # production: this opt-in run (tests/engine/axis_enums/) checks that it still
    # builds the Utf8 LP. Non-gating, like the Windows / macOS policy.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-xdist pytest-timeout pyyaml matplotlib

      - name: Set solver binary permissions
        run: |
          if [ -f bin/highs ]; then chmod +x bin/highs; fi

      - name: Run axis-Enum mode LP parity
        run: pytest -m axis_enums tests/engine/axis_enums -v --tb=short -n logical
