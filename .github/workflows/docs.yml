name: Docs

# Build the MkDocs site from `main` and publish it to the `gh-pages` branch,
# which GitHub Pages serves at https://irena-flextool.github.io/flextool/.
#
# This replaces the previous manual `mkdocs gh-deploy` (run by hand from a
# checkout) and makes `main` the single, explicit docs build source. GitHub
# Pages stays configured as-is: legacy build, source = `gh-pages` branch — this
# workflow just pushes the freshly built site there on every docs change.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      # The formulation page and the results catalogue are generated from the code (tools/mkdocs_hooks.py).
      - "flextool/engine/model/**"
      - "flextool/engine/solve/_benders.py"
      - "flextool/process_outputs/_output_meta.py"
      - "flextool/process_outputs/write_spinedb.py"
      - "flextool/schemas/default_plots.yaml"
      - "flextool/docs_build/**"
      - "tools/mkdocs_hooks.py"
  workflow_dispatch:

permissions:
  contents: write        # push the built site to the gh-pages branch

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gh-deploy needs history to update gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FlexTool and the MkDocs toolchain
        # FlexTool: the mkdocs hook generates the formulation page and the results catalogue from the code.
        # MkDocs: matches mkdocs.yml (material theme, mermaid2 plugin, pymdownx extensions).
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions

      - name: Configure git identity for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force
