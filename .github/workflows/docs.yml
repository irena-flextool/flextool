name: Docs

# Build the MkDocs site from `main` and publish it to the `gh-pages` branch,
# which GitHub Pages serves at https://irena-flextool.github.io/flextool/.
#
# This replaces the previous manual `mkdocs gh-deploy` (run by hand from a
# checkout) and makes `main` the single, explicit docs build source. GitHub
# Pages stays configured as-is: legacy build, source = `gh-pages` branch — this
# workflow just pushes the freshly built site there on every docs change.
#
# A release (a pushed `v*` tag) also redeploys, so every release is guaranteed
# to ship with the current docs even if its merge touched no docs path. The
# site always tracks `main`: a tag run builds `main`, not the tagged commit,
# so tagging an older commit cannot roll the site back.

on:
  push:
    branches: [main]
    # Releases. GitHub does not apply `paths` to tag pushes, so every tag runs.
    tags: ["v*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# A release merge and its tag push arrive together; deploy one at a time so
# the two gh-deploy pushes to gh-pages do not race.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write        # push the built site to the gh-pages branch

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # the site tracks main, also on a tag run
          fetch-depth: 0        # gh-deploy needs history to update gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install MkDocs toolchain
        # Matches mkdocs.yml: material theme, mermaid2 plugin, pymdownx extensions.
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions

      - name: Configure git identity for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force
