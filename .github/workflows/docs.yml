name: Docs

# Build the MkDocs site from `main` and publish it to the `gh-pages` branch,
# which GitHub Pages serves at https://irena-flextool.github.io/flextool/.
#
# This replaces the previous manual `mkdocs gh-deploy` (run by hand from a
# checkout) and makes `main` the single, explicit docs build source. GitHub
# Pages stays configured as-is: legacy build, source = `gh-pages` branch — this
# workflow just pushes the freshly built site there on every docs change.
#
# A release (a pushed `v*` tag) also redeploys, so every release is guaranteed
# to ship with the current docs even if its merge touched no docs path. The
# site always tracks `main`: a tag run builds `main`, not the tagged commit,
# so tagging an older commit cannot roll the site back.

on:
  push:
    branches: [main]
    # Releases. GitHub does not apply `paths` to tag pushes, so every tag runs.
    tags: ["v*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      # The formulation page and the results catalogue are generated from the code (tools/mkdocs_hooks.py).
      - "flextool/engine/model/**"
      - "flextool/engine/solve/_benders.py"
      - "flextool/process_outputs/_output_meta.py"
      - "flextool/process_outputs/write_spinedb.py"
      - "flextool/schemas/default_plots.yaml"
      - "flextool/docs_build/**"
      - "tools/mkdocs_hooks.py"
  workflow_dispatch:

# A release merge and its tag push arrive together; deploy one at a time so
# the two gh-pages pushes do not race.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write        # push the built site to the gh-pages branch

jobs:
  deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # the site tracks main, also on a tag run
          fetch-depth: 0        # the deploy step commits on top of gh-pages history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FlexTool and the MkDocs toolchain
        # FlexTool: the mkdocs hook generates the formulation page and the results catalogue from the code.
        # MkDocs: matches mkdocs.yml (material theme, mermaid2 plugin, pymdownx extensions).
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin pymdown-extensions

      - name: Configure git identity for the gh-pages commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build the site
        run: mkdocs build --site-dir "$RUNNER_TEMP/site"

      # Commit to gh-pages only when the published site changes. `mkdocs
      # gh-deploy` commits on every run, so a release merge and its tag push
      # each left a commit (the second one empty), and a theme patch release
      # rewrote every page's generator <meta> tag and nothing else. Changes
      # confined to that tag are not deployed on their own; the next real
      # deploy carries them along.
      - name: Deploy to gh-pages if the site changed
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"
          git rm -rq .
          cp -a "$RUNNER_TEMP/site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet -I 'name="generator"|"mkdocs-[0-9.]+, mkdocs-material-[0-9.]+"'; then
            echo "The site is unchanged; nothing to deploy."
            exit 0
          fi
          git commit -q -m "Deployed $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD) with MkDocs version: $(mkdocs --version | awk '{print $3}')"
          git push origin HEAD:gh-pages
